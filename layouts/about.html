{{- /* 关于页：只渲染 Markdown 正文（覆盖主题自带的数据驱动模板） */ -}}
{{ define "main" }}
<div class="section-content">
  <div class="container">
    {{ partial "_components/page-header.html" (dict "Title" .Title "Description" .Description) }}

    {{ with .Content }}
    <section class="about-content" data-aos="fade-up">
      <div class="content-card card">
        <div class="markdown-content enhanced-markdown">{{ . }}</div>
      </div>
    </section>
    {{ end }}
  </div>
</div>
{{ end }}
