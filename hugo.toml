baseURL = "https://dfuttu1.github.io/blog/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "dfuttu 的博客"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "记录技术折腾、部署踩坑与读书笔记"
  author = "dfuttu"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true

  [params.homeInfoParams]
    Title = "你好，我是 dfuttu"
    Content = "记录技术折腾、部署踩坑与读书笔记。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/dfuttu1"

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 30
